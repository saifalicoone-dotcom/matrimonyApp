# version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: matrimonial-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: matrimonial_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    # ports:
    #   - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: matrimonial-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  # Backend Application
  backend:
    build: .
    container_name: matrimonial-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=postgresql://postgres:password@postgres:5432/matrimonial_db?schema=public
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=your-super-secret-jwt-key-change-this-in-production
      - JWT_EXPIRES_IN=7d
      - JWT_REFRESH_SECRET=your-refresh-token-secret
      - JWT_REFRESH_EXPIRES_IN=30d
      - SMS_SERVICE=console
      - RAZORPAY_KEY_ID=rzp_test_xxxxxxxxxxxxx
      - RAZORPAY_KEY_SECRET=your_razorpay_key_secret
      - RAZORPAY_WEBHOOK_SECRET=your_webhook_secret
      - R2_ACCOUNT_ID=85d5534a60594e5a9b5b98b068aea109
      - R2_ACCESS_KEY_ID=ca3b32aaa712f2e039f6a789fc5599a9
      - R2_SECRET_ACCESS_KEY=b95db8991a04c0fb8bc6de25d492c235be7f2dc6853fffd369c25c67d35748b4
      - R2_BUCKET_NAME=development-bucket
      - R2_ENDPOINT=https://85d5534a60594e5a9b5b98b068aea109.r2.cloudflarestorage.com
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./uploads:/app/uploads
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local